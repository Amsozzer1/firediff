# The hosted playground behind a Cloudflare Tunnel. Run from this directory: docker compose up -d --build
# Nothing is published on the host and nothing is mounted: cloudflared dials out to Cloudflare, and
# Cloudflare sends firediff.amsozzer.com traffic back down that connection to http://firediff:8787.
# Put TUNNEL_TOKEN in deploy/.env (see .env.example and README.md).
# An explicit project name, so it can't merge with another compose project in a folder called deploy.
name: firediff

services:
  firediff:
    build: ..
    image: firediff-playground
    # cf-connecting-ip: the visitor's address, set by Cloudflare. Safe to trust because the only way
    # in is the tunnel (expose, not ports).
    # --max-requests 150: measured on the OptiPlex (i5-7600, 1.5 CPUs), about 1 s plus 15-30 ms per
    # request, so 150 finishes inside the 5 s limit with room to spare. See README.md, Calibrating.
    command: ["playground", "--hosted", "--ip-header", "cf-connecting-ip", "--max-requests", "150", "--host", "0.0.0.0", "--port", "8787"]
    expose: ["8787"]
    restart: unless-stopped
    init: true
    environment:
      # Cap the emulator's heap; if it runs out anyway it exits and firediff starts a new one.
      JAVA_TOOL_OPTIONS: -Xmx1g -XX:+ExitOnOutOfMemoryError
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.5
    pids_limit: 512
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in deploy/.env}
    restart: unless-stopped
    depends_on: [firediff]
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
